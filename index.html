<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="A website to enter a data set and visualise how it gets sorted with a selected algorithm"
    />

    <title>Sorting Visualiser</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>Sorted</h1>

      <h2>How To Use</h2>
      <ol>
        <li>Enter a data set separated by commas</li>
        <li>Select a sorting algorithm</li>
        <li>Click "Visualise"</li>
      </ol>

      <h2>Inputs</h2>
      <div class="input-container">
        <label for="inputs"></label>
        <textarea
          id="inputs"
          placeholder="Enter Data e.g., 5, 2, 8, 1, 4"
        ></textarea>
      </div>

      <h2>Algorithm</h2>
      <div class="algorithm-button-group">
        <button id="bubbleSort">Bubble Sort</button>
        <button id="insertionSort">Insertion Sort</button>
        <button id="selectionSort">Selection Sort</button>
        <button id="mergeSort">Merge Sort</button>
        <button id="quickSort">Quick Sort</button>
      </div>

      <div class="button-container">
        <button id="visualiseButton">Visualise</button>
      </div>

      <div id="visualisation"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
