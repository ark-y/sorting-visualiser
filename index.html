<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="description" content="A website to enter a data set and visualise how it gets sorted with a selected algorithm">
    
    <title>Sorting Visualiser</title>
    
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div class="container">
      <h1>Sorted</h1>

      <h2>How To Use</h2>
      <ol>
        <li>Enter a data set separated by commas</li>
        <li>Select a sorting algorithm</li>
        <li>Click "Visualise"</li>
      </ol>

      <h2>Inputs</h2>
      <label for="inputs">Define Inputs</label>
      <div class="input-container">

        <input type="text" id="inputs" placeholder="5, 2, 7, 1, 4">
      </div>

      <h2>Algorithm</h2>
      <select id="algorithm">
        <option value="bubbleSort">Bubble Sort</option>
        <option value="selectionSort">Selection Sort</option>
        <option value="insertionSort">Insertion Sort</option>
        <option value="mergeSort">Merge Sort</option>
        <option value="quickSort">Quick Sort</option>
      </select>

      <div class="button-container">
        <button id="visualiseButton">Visualise</button>
      </div>

      <div id="visualisation"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
